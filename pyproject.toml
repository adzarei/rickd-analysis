[project]
name = "rickd-analysis"
version = "0.1.0"
description = "Analysis project for RICKD"
authors = [
    {name = "Adrian Zapater", email = "adrianzapater@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [{include = "core", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0.0"
numpy = ">=2.1.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
scikit-learn = "^1.3.0"
plotly = "^6.0.1"
ipykernel = "^6.29.5"
pydantic = "^2.11.7"
jupyter = "^1.1.1"
scipy = "^1.11.0"
kineticstoolkit = "^0.16.4"
dtw-python = "^1.5.3"
feature-engine = "^1.8.3"
imbalanced-learn = "^0.13.0"
shap = "^0.48.0"
lime = "^0.2.0.1"
keras-tuner = "^1.4.7"
xgboost = "^3.0.4"
tensorflow = "==2.19.*"
tensorflow-metal = "^1.2.0"

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
isort = "^5.12.0"
ruff = "^0.1.0"
pre-commit = "^3.3.0"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "RUF"]
ignore = []

[tool.ruff.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
